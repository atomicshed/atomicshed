<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}
.item{
    background:white;
    padding:10px;
    border-radius:8px;
}
img{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
}
.name{
    margin-top:8px;
    font-size:12px;
    word-break:break-word;
}
</style>
</head>
<body>

<h3>Macbook Pro Max, M2</h3>
<div id="gallery" class="gallery"></div>

<script>
const USER = "atomicshed";
const REPO = "atomicshed";

// Works out which folder this page is in
const path = location.pathname
  .replace(/^\/[^/]+\//, "")      // remove repo name
  .replace(/index\.html$/, "")
  .replace(/\/$/, "");

const api = `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

fetch(api)
  .then(r => r.json())
  .then(files => {
    const gallery = document.getElementById("gallery");

    files
      .filter(f => /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(f.name))
      .forEach(f => {
        gallery.insertAdjacentHTML("beforeend", `
          <div class="item">
            <img src="${f.download_url}" alt="${f.name}">
            <div class="name">${f.name}</div>
          </div>
        `);
      });
  })
  .catch(console.error);
</script>

</body>
</html>
