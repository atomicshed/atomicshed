<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>PROJECT : John Cooper</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .hero {
            display:block;
            width:auto;
            height:auto;
            max-width:min(100%, 900px);
            max-height:70vh;
            margin:0 0 60px;
        }

        .project-details {
            display:grid;
            grid-template-columns:180px 1fr;
            gap:8px 20px;
            max-width:780px;
            margin-bottom:60px;
        }

        .gallery {
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap:30px;
        }

        .gallery a {
            display:block;
        }

        .gallery img {
            display:block;
            width:100%;
            height:auto;
        }

        .gallery a:hover img {
            opacity:.75;
        }

        @media (max-width:900px) {

            .project-details {
                grid-template-columns:120px 1fr;
            }

            .gallery {
                grid-template-columns:repeat(2, minmax(0, 1fr));
                gap:20px;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="/" class="logo">
        <img src="/images/atomicshed.svg" alt="atomicshed"> new
    </a>

</header>


<div id="project"></div>


<script>

const USER = 'atomicshed';
const REPO = 'atomicshed';


/*
    Get the current project folder.

    Example:

    /portfolio/Sleek_Events/2025-10-01-temenos/

    becomes:

    portfolio/Sleek_Events/2025-10-01-temenos
*/

const path = location.pathname
    .replace(/\/index\.html$/, '')
    .replace(/^\/|\/$/g, '');


/*
    GitHub API location for this project.
*/

const api =
    `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;


/*
    Load project information and the project folder contents.
*/

Promise.all([

    fetch('project.json')
        .then(r => {

            if (!r.ok) {
                throw new Error('Could not load project.json');
            }

            return r.json();

        }),

    fetch(api)
        .then(r => {

            if (!r.ok) {
                throw new Error(
                    `Could not load project folder (${r.status})`
                );
            }

            return r.json();

        })

])


.then(([p, files]) => {


    /*
        Find all images.
    */

    const imgs = files

        .filter(f =>
            /\.(jpe?g|png|gif|webp|svg)$/i.test(f.name)
        )

        .sort((a, b) => {

            /*
                Always put hero first.
            */

            const aHero = /^hero\./i.test(a.name);
            const bHero = /^hero\./i.test(b.name);

            if (aHero && !bHero) return -1;
            if (!aHero && bHero) return 1;

            /*
                Natural numerical sorting.

                01.jpg
                02.jpg
                10.jpg
            */

            return a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric:true,
                    sensitivity:'base'
                }
            );

        });


    const hero =
        imgs.find(i => /^hero\./i.test(i.name));


    const gallery =
        imgs.filter(i => i !== hero);


    /*
        Set browser title.
    */

    document.title =
        `${p.title} : ${p.client || ''} : John Cooper`;


    /*
        Display project.
    */

    document.getElementById('project').innerHTML = `

        <h1>${p.title}</h1>

        <h3>${p.description}</h3>


        ${hero ? `

            <img
                class="hero"
                src="${hero.name}?v=${hero.sha}"
                alt=""
            >

        ` : ''}


        <div class="project-details">

            <div>Client</div>
            <div>${p.client || ''}</div>

            <div>Agency</div>
            <div>
                <a href="../">${p.agency || ''}</a>
            </div>

            <div>Location</div>
            <div>${p.location || ''}</div>

            <div>Date</div>
            <div>
                ${p.date
                    ? new Date(p.date).toLocaleDateString(
                        'en-GB',
                        {
                            month:'long',
                            year:'numeric'
                        }
                    )
                    : ''
                }
            </div>

            <div>Skills</div>
            <div>
                ${Array.isArray(p.skills)
                    ? p.skills.join(', ')
                    : ''
                }
            </div>

        </div>


        <div class="gallery">

            ${gallery.map(i => `

                <a
                    href="${i.name}?v=${i.sha}"
                    target="_blank"
                >

                    <img
                        src="${i.name}?v=${i.sha}"
                        alt=""
                    >

                </a>

            `).join('')}

        </div>

    `;

})


.catch(error => {

    console.error(error);

    document.getElementById('project').innerHTML = `

        <p>
            Unable to load project.
        </p>

    `;

});

</script>


<footer>

    <p class="footer-text">
        &copy;
        <span id="year"></span>
        John Cooper / atomicshed
    </p>


    <script>

    document.getElementById("year").textContent =
        new Date().getFullYear();

    </script>


    <p class="footer-text">
        Work shown is presented for portfolio purposes only.
        Copyright and trademarks remain the property of the
        respective agencies, clients and rights holders.
    </p>

</footer>


</body>

</html>
