	<div id=projects>

<script>
fetch('projects.json')
    .then(r => r.json())
    .then(p => {
        p.sort((a, b) => b.folder.slice(0, 10).localeCompare(a.folder.slice(0, 10)));

        projects.innerHTML = p.map(x => {
            const date = new Date(x.folder.slice(0, 10) + 'T12:00:00');

            return `<section>
                <h2><a href="${x.folder}/">${x.title}</a></h2>
                <p>${date.toLocaleDateString('en-GB', {
                    month: 'long',
                    year: 'numeric'
                })}</p>
                <h3>${x.description}</h3>
            </section>`;
        }).join('');
    });
</script>

		<footer>
			<p class="footer-text">&copy; <span id="year"></span> John Cooper / atomicshed</p>
	
		<script>
		document.getElementById("year").textContent = new Date().getFullYear();
		</script>
