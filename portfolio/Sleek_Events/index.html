<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>atomicshed : Portfolio</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .agency-name {
            font-size:3rem;
            line-height:1;
            margin-bottom:50px;
        }

        .project-grid {
            display:grid;
            grid-template-columns:repeat(4, minmax(0, 1fr));
            gap:30px;
            width:100%;
        }

        .project-card a {
            display:block;
        }

        .project-card img {
            display:block;
            width:100%;
            aspect-ratio:16 / 9;
            object-fit:cover;
        }

        .project-card h2 {
            font-size:1.5rem;
            line-height:1.1;
            margin:10px 0 0;
        }

        .project-card h3 {
            font-size:1rem;
            line-height:1.2;
            margin:5px 0 0;
        }

        .project-card a:hover img {
            opacity:.75;
        }

        @media (max-width:900px) {
            .project-grid {
                grid-template-columns:repeat(2, minmax(0, 1fr));
                gap:20px;
            }

            .project-card h2 {
                font-size:1.2rem;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="/" class="logo">
        <img src="/images/atomicshed.svg" alt="atomicshed">
    </a>

</header>

<h2 class="agency-name" id="agency-name"></h2>

<div id="agency" class="project-grid"></div>

<script>

const USER = 'atomicshed';
const REPO = 'atomicshed';

/*
    Work out the current agency folder.
    Example:
    /portfolio/Fresh/
    becomes:
    Fresh
*/

const path = location.pathname
    .replace(/\/index\.html$/, '')
    .replace(/^\/|\/$/g, '');

const agencyFolder = path.split('/').pop();

/*
    Encode each part of the GitHub path separately.
*/

const githubPath = path
    .split('/')
    .map(encodeURIComponent)
    .join('/');

const api =
    `https://api.github.com/repos/${USER}/${REPO}/contents/${githubPath}`;


/*
    Load projects.json and agencies.json.
*/

Promise.all([

    fetch(`/${path}/projects.json`)
        .then(r => {
            if (!r.ok) {
                throw new Error(
                    `projects.json returned ${r.status}`
                );
            }
            return r.json();
        }),

    fetch('/portfolio/agencies.json')
        .then(r => {
            if (!r.ok) {
                throw new Error(
                    `agencies.json returned ${r.status}`
                );
            }
            return r.json();
        })

])

.then(([projects, agencies]) => {

    /*
        Find the agency name.
    */

    const agency = agencies.find(x =>
        x.folder.toLowerCase() ===
        agencyFolder.toLowerCase()
    );

    document.getElementById('agency-name').textContent =
        agency ? agency.name : agencyFolder;


    /*
        Sort projects newest first.
    */

    projects.sort((a, b) =>
        b.folder.slice(0, 10).localeCompare(
            a.folder.slice(0, 10)
        )
    );


    /*
        Find the hero image for each project.
    */

    const requests = projects.map(project => {

        const projectPath =
            `${githubPath}/${encodeURIComponent(project.folder)}`;

        const projectAPI =
            `https://api.github.com/repos/${USER}/${REPO}/contents/${projectPath}`;

        return fetch(projectAPI)

            .then(r => {

                if (!r.ok) {
                    throw new Error(
                        `${project.folder}: GitHub returned ${r.status}`
                    );
                }

                return r.json();

            })

            .then(files => {

                const hero = files.find(file =>
                    /^hero\./i.test(file.name) &&
                    /\.(jpe?g|png|gif|webp|svg)$/i.test(file.name)
                );

                if (!hero) {
                    console.log(
                        `No hero image found for ${project.folder}`
                    );
                    return '';
                }

                return `
                    <section class="project-card">

                        <a href="${project.folder}/">

                            <img
                                src="${hero.download_url}"
                                alt="${project.title}"
                            >

                            <h2>${project.title}</h2>

                            <h3>${project.description}</h3>

                        </a>

                    </section>
                `;

            })

            .catch(error => {

                console.error(error);
                return '';

            });
    });


    return Promise.all(requests);

})

.then(cards => {

    document.getElementById('agency').innerHTML =
        cards.join('');

})

.catch(error => {

    console.error(error);

    document.getElementById('agency').innerHTML =
        `<p>Unable to load portfolio.<br>${error.message}</p>`;

});

</script>


<footer>

    <p class="footer-text">
        &copy; <span id="year"></span> John Cooper / atomicshed
    </p>

    <script>
    document.getElementById("year").textContent =
        new Date().getFullYear();
    </script>

    <p class="footer-text">
        Work shown is presented for portfolio purposes only.
        Copyright and trademarks remain the property of the
        respective agencies, clients and rights holders.
    </p>

</footer>

</body>
</html>
