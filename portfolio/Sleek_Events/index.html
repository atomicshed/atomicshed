<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>atomicshed : Cards Portfolio v2</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .agency-hero {
            display:block;
            width:auto;
            height:auto;
            max-width:min(100%, 1200px);
            max-height:70vh;
            margin:0 0 80px;
        }

       .project-grid {
			display:grid;
			grid-template-columns:repeat(4, minmax(0, 1fr));
			gap:30px;
			width:100%;
		}

       .agency-card img,
		.project-card img {
			display:block;
			width:100%;
			aspect-ratio:16 / 9;
			object-fit:cover;
		}

        .project-card h2 {
            font-size:1.5rem;
            line-height:1.1;
            margin:10px 0 0;
        }

        .project-card h3 {
            font-size:1rem;
            line-height:1.2;
            margin:5px 0 0;
        }

        .project-card a {
            display:block;
        }

        .project-card a:hover img {
            opacity:.75;
        }

        @media (max-width:900px) {
          .agency-grid,
    .project-grid {
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:20px;
    }

            .project-card h2 {
                font-size:1.2rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="logo">
        <img src="/images/atomicshed.svg" alt="atomicshed">
    </a>
</header>

<div id="agency"></div>




<script>
const USER = 'atomicshed';
const REPO = 'atomicshed';

const path = location.pathname
    .replace(/\/index\.html$/, '')
    .replace(/^\/|\/$/g, '');

const api =
    `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

Promise.all([
    fetch('projects.json').then(r => r.json()),
    fetch(api).then(r => r.json())
])
.then(([projects, files]) => {

    /*
    const hero = files.find(f =>
        /^hero\./i.test(f.name) &&
        /\.(jpe?g|png|gif|webp|svg)$/i.test(f.name)
    );
    */

    const agencyName = path.split('/').pop();

    document.getElementById('agency-name').textContent = agencyName;

    projects.sort((a, b) =>
        b.folder.slice(0, 10).localeCompare(
            a.folder.slice(0, 10)
        )
    );

    const projectPromises = projects.map(x => {

        const projectAPI =
            `https://api.github.com/repos/${USER}/${REPO}/contents/${path}/${x.folder}`;

        return fetch(projectAPI)
            .then(r => r.json())
            .then(files => {

                const projectHero = files.find(f =>
                    /^hero\./i.test(f.name) &&
                    /\.(jpe?g|png|gif|webp|svg)$/i.test(f.name)
                );

                if (!projectHero) return '';

                return `
                    <section class="project-card">
                        <a href="${x.folder}/">
                            <img
                                src="${projectHero.download_url}"
                                alt="${x.title}"
                            >
                            <h2>${x.title}</h2>
                            <h3>${x.description}</h3>
                        </a>
                    </section>
                `;
            });
    });

    Promise.all(projectPromises)
        .then(cards => {

            document.getElementById('agency').innerHTML = `
                <div class="project-grid">
                    ${cards.join('')}
                </div>
            `;
        });
});
</script>
