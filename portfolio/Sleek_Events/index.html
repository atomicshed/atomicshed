<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>atomicshed : Portfolio</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .agency-hero {
            display:block;
            width:auto;
            height:auto;
            max-width:min(100%, 1200px);
            max-height:70vh;
            margin:0 0 80px;
        }

        .project-grid {
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:30px;
        }

        .project-card img {
            display:block;
            width:100%;
            aspect-ratio:16 / 9;
            object-fit:cover;
        }

        .project-card h2 {
            font-size:1.5rem;
            line-height:1.1;
            margin:10px 0 0;
        }

        .project-card h3 {
            font-size:1rem;
            line-height:1.2;
            margin:5px 0 0;
        }

        .project-card a {
            display:block;
        }

        .project-card a:hover img {
            opacity:.75;
        }

        @media (max-width:900px) {
            .project-grid {
                grid-template-columns:repeat(2, 1fr);
                gap:20px;
            }

            .project-card h2 {
                font-size:1.2rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="logo">
        <img src="/images/atomicshed.svg" alt="atomicshed">
    </a>
</header>

<div id="agency"></div>

<script>
const agency = document.getElementById('agency');

Promise.all([
    fetch('projects.json').then(r => r.json()),
    fetch('./').then(r => r.json())
])
.then(([projects, files]) => {

    const hero = files.find(f =>
        /^hero\./i.test(f.name) &&
        /\.(jpe?g|png|gif|webp|svg)$/i.test(f.name)
    );

    projects.sort((a, b) =>
        b.folder.slice(0, 10).localeCompare(
            a.folder.slice(0, 10)
        )
    );

    const heroHTML = hero ? `
        <img
            class="agency-hero"
            src="${hero.name}"
            alt=""
        >
    ` : '';

    const projectsHTML = projects.map(x => `
        <section class="project-card">
            <a href="${x.folder}/">
                <img
                    src="${x.folder}/hero.jpg"
                    alt="${x.title}"
                >
                <h2>${x.title}</h2>
                <h3>${x.description}</h3>
            </a>
        </section>
    `).join('');

    agency.innerHTML = `
        ${heroHTML}
        <div class="project-grid">
            ${projectsHTML}
        </div>
    `;
});
</script>

<footer>
    <p class="footer-text">
        &copy; <span id="year"></span> John Cooper / atomicshed
    </p>

    <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <p class="footer-text">
        Work shown is presented for portfolio purposes only. Copyright and trademarks remain the property of the respective agencies, clients and rights holders.
    </p>
</footer>

</body>
</html>
