<!doctype html>
<link rel=stylesheet href=/style.css>

<header>
<a class=logo href='/'><img src='/images/atomicshed.svg'></a>
</header>

<div id=project></div>

<script>
const USER='atomicshed',REPO='atomicshed';
const path=location.pathname.replace(/\/index\.html$/,'').replace(/^\/|\/$/g,'');
const api=`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

Promise.all([
    fetch('project.json').then(r=>r.json()),
    fetch(api).then(r=>r.json())
]).then(([p,files])=>{

    const imgs=files
        .filter(f=>/\.(jpe?g|png|gif|webp|svg)$/i.test(f.name))
        .sort((a,b)=>{

            const aHero=/^hero\./i.test(a.name);
            const bHero=/^hero\./i.test(b.name);

            if(aHero&&!bHero) return -1;
            if(!aHero&&bHero) return 1;

            return a.name.localeCompare(b.name,undefined,{
                numeric:true,
                sensitivity:"base"
            });

        });

    const hero = imgs.find(i => /^hero\./i.test(i.name));
    const gallery = imgs.filter(i => i !== hero);

    project.innerHTML=`<h1>${p.title}</h1>

<p>${p.description}</p>

${hero ? `
<a href='${hero.name}?v=${hero.sha}' target=_blank>
    <img class="hero" src='${hero.name}?v=${hero.sha}' alt=''>
</a>` : ''}

<div class=project-details>
<div>Client</div>
<div>${p.client}</div>
<div>Agency</div>
<div><a href="../">${p.agency}</a></div>
<div>Location</div>
<div>${p.location}</div>
<div>Date</div>
<div>${new Date(p.date).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>
<div>Skills</div>
<div>${p.skills.join(', ')}</div>
</div>

<div class=gallery>
${gallery.map(i=>`<a href='${i.name}?v=${i.sha}' target=_blank>
<img src='${i.name}?v=${i.sha}' alt=''>
</a>`).join('')}
</div>`;

});
</script>
