<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>atomicshed : Client Portfolio v4</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .agency-grid {
            display:grid;
            grid-template-columns:repeat(4, minmax(0, 1fr));
            gap:30px;
            width:100%;
        }

        .agency-card a {
            display:block;
        }

        .agency-card img {
            display:block;
            width:100%;
            aspect-ratio:16 / 9;
            object-fit:cover;
        }

        .agency-card p {
            font-size:1.5rem;
            line-height:1.1;
            margin:10px 0 0;
        }

        .agency-card a:hover img {
            opacity:.75;
        }

        @media (max-width:900px) {

            .agency-grid {
                grid-template-columns:repeat(2, minmax(0, 1fr));
                gap:20px;
            }

            .agency-card p {
                font-size:1.2rem;
            }

        }

    </style>
</head>

<body>

<header>

    <a href="/" class="logo">
        <img src="/images/atomicshed.svg" alt="atomicshed">
    </a>

</header>


<div id="agencies" class="agency-grid"></div>


<script>

fetch('agencies.json')

    .then(response => response.json())

    .then(agencies => {

        document.getElementById('agencies').innerHTML =
            agencies.map(agency => `

                <section class="agency-card">

                    <a href="${agency.folder}/">

                        <img
                            src="${agency.folder}/hero.png"
                            alt="${agency.name}"
                        >

                    //     <p>${agency.name}</p>

                    </a>

                </section>

            `).join('');

    })

    .catch(error => {

        console.error('Could not load agencies:', error);

        document.getElementById('agencies').innerHTML =
            '<p>Unable to load portfolio.</p>';

    });

</script>


<footer>

    <p class="footer-text">
        &copy; <span id="year"></span> John Cooper / atomicshed
    </p>

    <script>
    document.getElementById("year").textContent =
        new Date().getFullYear();
    </script>

    <p class="footer-text">
        Work shown is presented for portfolio purposes only.
        Copyright and trademarks remain the property of the
        respective agencies, clients and rights holders.
    </p>

</footer>


</body>
</html>
