<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow, noarchive">
		<title>atomicshed : John Cooper</title>
		<link rel="stylesheet" href="/style.css">

		<style>

		.hero {
			display:block;
			width:auto;
			height:auto;
			max-width:min(100%, 900px);
			max-height:70vh;
			margin:0 0 60px;
		}

		.project-details {
			display:grid;
			grid-template-columns:180px 1fr;
			gap:8px 20px;
			max-width:780px;
			margin-bottom:60px;
		}

		.gallery {
			display:grid;
			grid-template-columns:repeat(4, minmax(0, 1fr));
			gap:30px;
			width:100%;
		}

		.gallery a {
			display:block;
		}

		.gallery img {
			display:block;
			width:100%;
			aspect-ratio:16 / 9;
			object-fit:cover;
		}

		.project-card h2 {
			font-size:1.5rem;
			line-height:1.1;
			margin:10px 0 0;
		}

		.gallery a:hover img {
			opacity:.75;
		}

		.agency-link {
			display:inline-block;
			margin-right:15px;
		}

		.other-projects {
			display:inline-block;
			background:#fff;
			padding:1px 5px;
		}

		.other-projects:hover {
			background:#000;
			color:#fff;
		}

		@media (max-width:900px) {

			.project-details {
				grid-template-columns:120px 1fr;
			}

			.gallery {
				grid-template-columns:repeat(2, minmax(0, 1fr));
				gap:20px;
			}

			.project-card h2 {
				font-size:1.2rem;
			}

		}

		</style>
	</head>

	<body>

	<header>
		<a href="/" class="logo">
			<img src="/images/atomicshed.svg" alt="atomicshed">
		</a>
	</header>
	
	
	<div id="project"></div>
		
	<script>

	const USER = 'atomicshed';
	const REPO = 'atomicshed';

	const path = location.pathname
		.replace(/\/index\.html$/, '')
		.replace(/^\/|\/$/g, '');

	const api =
		`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

	Promise.all([

		fetch('project.json')
			.then(r => r.json()),

		fetch(api)
			.then(r => r.json()),

		fetch('/portfolio/agencies.json')
			.then(r => r.json())

	])
	.then(([p, files, agencies]) => {

		const imgs = files
			.filter(f =>
				/\.(jpe?g|png|gif|webp|svg)$/i.test(f.name)
			)
			.sort((a, b) => {

				const aHero = /^hero\./i.test(a.name);
				const bHero = /^hero\./i.test(b.name);

				if (aHero && !bHero) return -1;
				if (!aHero && bHero) return 1;

				return a.name.localeCompare(
					b.name,
					undefined,
					{
						numeric:true,
						sensitivity:"base"
					}
				);

			});

		const hero =
			imgs.find(i => /^hero\./i.test(i.name));

		const gallery =
			imgs.filter(i => i !== hero);


		/* Find the agency in agencies.json */

		const agency =
			agencies.find(a =>
				a.name.toLowerCase() ===
				(p.agency || '').toLowerCase()
			);


		const agencyWebsite =
			agency && agency.website
				? agency.website
				: null;


		document.title =
			`${p.agency || ''} : ${p.title || ''} : John Cooper atomicshed`;


		document.getElementById('project').innerHTML = `

			<h1>${p.title}</h1>

			<h3>${p.description}</h3>

			${hero ? `

				<img
					class="hero"
					src="${hero.name}?v=${hero.sha}"
					alt=""
				>

			` : ''}


			<div class="project-details">

				<div>Client</div>
				<div>${p.client || ''}</div>


				<div>Agency<br/><a
						class="other-projects"
						href="../"
					>
						Other projects
					</a></div>

				<div>

					${agencyWebsite ? `
						<a
							class="agency-link"
							href="${agencyWebsite}"
							target="_blank"
							rel="noopener"
						>
							${p.agency || ''}
						</a>
					` : `
						${p.agency || ''}
					`}

					<a
						class="other-projects"
						href="../"
					>
						Other projects
					</a>

				</div>


				<div><!--Location-->&nbsp;</div>

				<div>
					${p.location || ''}
				</div>


				<div><!--Date-->&nbsp;</div>

				<div>
					${p.date
						? new Date(p.date).toLocaleDateString(
							'en-GB',
							{
								month:'long',
								year:'numeric'
							}
						)
						: ''
					}
				</div>


				<div><!--Skills-->&nbsp;</div>

				<div>
					${Array.isArray(p.skills)
						? p.skills.join(', ')
						: ''
					}
				</div>

			</div>


			<div class="gallery">

				${gallery.map(i => {

					const displayName = i.name
						.replace(/^[^-]*-/, '')
						.replace(/\.[^.]+$/, '')
						.replace(/_/g, ' ');

					return `

						<section class="project-card">

							<a
								href="${i.name}?v=${i.sha}"
								target="_blank"
							>

								<img
									src="${i.name}?v=${i.sha}"
									alt="${displayName}"
								>

								<h2>${displayName}</h2>

							</a>

						</section>

					`;

				}).join('')}

			</div>
		`;

	})
	.catch(error => {

		console.error(error);

		document.getElementById('project').innerHTML =
			'<p>Unable to load project.</p>';

	});

	</script>
		
	<footer>
		
		<p class="footer-text">
			&copy; <span id="year"></span> John Cooper / atomicshed
		</p>
		
		<script>
			document.getElementById("year").textContent =
				new Date().getFullYear();
		</script>
		
		<p class="footer-text">
			Work shown is presented for portfolio purposes only.
			Copyright and trademarks remain the property of the
			respective agencies, clients and rights holders.
		</p>
		
	</footer>

	</body>
</html>
